<!DOCTYPE html>

<head>

    <style>
        body {

        .section {
            margin: 18%;
            margin-top: 10px;
            border-radius: 2px;
            border: 2px solid white;
            padding: 2rem;
            width: fit-content;
            height: fit-content;
        }

        .firstbox {
            height: 300px;
            width: 300px;
            border-radius: 10px;
            color: aliceblue;
            box-shadow: 2px 2px 2px 2px rgba(255, 255, 255, 0.92);
            filter: saturate(0%);
        }

            width: 300px;
            border-radius: 10px;
            color: aliceblue;
            box-shadow: 2px 2px 2px 2px rgba(255, 255, 255, 0.92);
            filter: saturate(100%);
            transform: scale(1.2);
            transition: transform 0.2s ease;
        }
